<div class="pagination-container" *ngIf="totalElements > 0">
  <!-- 1. THỐNG KÊ SỐ BẢN GHI HIỆN TẠI -->
  <div class="pagination-info">
    <span>
      Hiển thị <strong>{{ startIndex }} - {{ endIndex }}</strong> trên tổng số <strong>{{ totalElements }}</strong> bản ghi
    </span>
  </div>

  <!-- 2. CỤM ĐIỀU HƯỚNG SỐ TRANG -->
  <div class="pagination-controls">
    <!-- Nút Trang Đầu (First) -->
    <button 
      type="button" 
      class="page-btn nav-btn" 
      [disabled]="currentPage === 0" 
      (click)="goToPage(0)"
      title="Trang đầu"
    >
      «
    </button>

    <!-- Nút Trang Trước (Previous) -->
    <button 
      type="button" 
      class="page-btn nav-btn" 
      [disabled]="currentPage === 0" 
      (click)="goToPage(currentPage - 1)"
      title="Trang trước"
    >
      ‹
    </button>

    <!-- Danh sách các số trang thông minh -->
    @for (p of visiblePages; track $index) {
      @if (p === '...') {
        <span class="page-ellipsis">...</span>
      } @else {
        <button 
          type="button" 
          class="page-btn num-btn" 
          [class.active]="p === currentPage + 1"
          (click)="onPageClick(p)"
        >
          {{ p }}
        </button>
      }
    }

    <!-- Nút Trang Kế Tiếp (Next) -->
    <button 
      type="button" 
      class="page-btn nav-btn" 
      [disabled]="currentPage >= totalPages - 1" 
      (click)="goToPage(currentPage + 1)"
      title="Trang sau"
    >
      ›
    </button>

    <!-- Nút Trang Cuối (Last) -->
    <button 
      type="button" 
      class="page-btn nav-btn" 
      [disabled]="currentPage >= totalPages - 1" 
      (click)="goToPage(totalPages - 1)"
      title="Trang cuối"
    >
      »
    </button>
  </div>

  <!-- 3. TÙY CHỌN SỐ LƯỢNG BẢN GHI TRÊN MỖI TRANG -->
  <div class="pagination-size">
    <label for="pageSizeSelect">Mỗi trang:</label>
    <select 
      id="pageSizeSelect" 
      class="form-select-sm" 
      [ngModel]="pageSize" 
      (ngModelChange)="onPageSizeChange($event)"
    >
      @for (opt of pageSizeOptions; track opt) {
        <option [value]="opt">{{ opt }} dòng</option>
      }
    </select>
  </div>
</div>
